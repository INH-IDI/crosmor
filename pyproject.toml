[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crosmor"
version = "2026.1.0"
description = "Modern Python implementation of CROSMOR coastal morphodynamic model with native GUI"
readme = "README.md"
authors = [
    { name = "Antigravity Pair Programmer" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "numba>=0.58.0",
    "pydantic>=2.0.0",
    "PyQt6>=6.5.0",
    "pyqtgraph>=0.13.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
crosmor-gui = "crosmor.gui.main_window:main"
crosmor-cli = "crosmor.engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
